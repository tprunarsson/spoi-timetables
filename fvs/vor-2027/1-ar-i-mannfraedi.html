<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1. ár í mannfræði — Stundatafla</title>
<link rel="stylesheet" href="../../oskir/style.css">
<style>
  .tt-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 12px; }
  .tt-bar select, .tt-bar button { font: inherit; padding: 6px 10px; border-radius: 6px;
    border: 1px solid #cbd5e1; background: #fff; color: inherit; }
  .tt-bar button { cursor: pointer; }
  .tt-bar select { width: auto; flex: 0 1 260px; min-width: 0; }
  .tt-grid { display: grid; grid-template-columns: 52px repeat(var(--days), minmax(0, 1fr));
    position: relative; border-top: 1px solid #e2e8f0; }
  .tt-head { font-weight: 600; font-size: 13px; padding: 6px 4px; text-align: center;
    border-bottom: 1px solid #e2e8f0; }
  .tt-times { position: relative; }
  .tt-time { position: absolute; right: 6px; font-size: 11px; color: #64748b;
    transform: translateY(-50%); }
  .tt-day { position: relative; border-left: 1px solid #e2e8f0; }
  .tt-line { position: absolute; left: 0; right: 0; border-top: 1px dashed #eef2f7; }
  .tt-ev { position: absolute; border-radius: 5px; padding: 2px 4px; font-size: 11px;
    line-height: 1.25; overflow: hidden; color: #fff; background: #2563eb;
    border: 1px solid rgba(0,0,0,.15); box-sizing: border-box; }
  .tt-ev b { display: block; font-size: 12px; }
  .tt-empty { color: #64748b; padding: 16px 0; }
  .tt-list { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tt-list th, .tt-list td { text-align: left; padding: 5px 6px; border-bottom: 1px solid #e2e8f0;
    vertical-align: top; }
  .tt-swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px;
    margin-right: 6px; vertical-align: middle; }
  @media (max-width: 640px) { .tt-ev { font-size: 10px; } .tt-ev b { font-size: 11px; } }
</style>
</head>
<body>
<header class="page-head">
  <h1>1. ár í mannfræði</h1>
  <p class="lede">Vor 2027 · <a href="../">&larr; Til baka</a></p>
</header>
<main>
  <section class="card">
    <div class="tt-bar">
      <button type="button" id="prev" aria-label="Fyrri vika">&larr;</button>
      <select id="week" aria-label="Vika"></select>
      <button type="button" id="next" aria-label="Næsta vika">&rarr;</button>
    </div>
    <div id="grid"></div>
  </section>
  <section class="card">
    <h2>Öll námskeið</h2>
    <div style="overflow-x:auto"><table class="tt-list" id="list"></table></div>
    <p class="hint">Síðast uppfært 2026-10-02. Birt úr Spoi; breytingar geta orðið.</p>
  </section>
</main>
<script id="tt-data" type="application/json">{"name": "1. ár í mannfræði", "isoYear": 2027, "weeks": [], "courses": [], "sessions": []}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('tt-data').textContent);
  var DAY_NAMES = ['Mán', 'Þri', 'Mið', 'Fim', 'Fös', 'Lau', 'Sun'];
  var PALETTE = ['#2563eb', '#0f766e', '#b45309', '#7c3aed', '#be123c', '#15803d',
                 '#0369a1', '#a21caf', '#4d7c0f', '#c2410c'];
  var colors = {};
  DATA.courses.forEach(function (c, i) { colors[c.id] = c.color || PALETTE[i % PALETTE.length]; });
  var names = {};
  DATA.courses.forEach(function (c) { names[c.id] = c.name; });
  var PX_PER_MIN = 0.9, DAY_START = 8 * 60 + 20, DAY_END = 19 * 60;

  function minutes(t) { var p = t.split(':'); return +p[0] * 60 + +p[1]; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function shortDate(iso, add) {
    var d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + (add || 0));
    return d.getUTCDate() + '.' + (d.getUTCMonth() + 1) + '.';
  }
  function ranges(weeks) {
    var out = [], run = [];
    weeks.slice().sort(function (a, b) { return a - b; }).forEach(function (w) {
      if (run.length && w === run[run.length - 1] + 1) { run.push(w); return; }
      if (run.length) out.push(run.length === 1 ? run[0] : run[0] + '-' + run[run.length - 1]);
      run = [w];
    });
    if (run.length) out.push(run.length === 1 ? run[0] : run[0] + '-' + run[run.length - 1]);
    return out.join(', ');
  }

  var select = document.getElementById('week');
  DATA.weeks.forEach(function (w) {
    var opt = document.createElement('option');
    opt.value = w.week;
    opt.textContent = 'Vika ' + w.week + ' (' + shortDate(w.monday) + ' - ' + shortDate(w.monday, 4) + ')';
    select.appendChild(opt);
  });
  var today = new Date().toISOString().slice(0, 10);
  var current = DATA.weeks.filter(function (w) { return w.monday <= today; }).pop();
  if (current && today <= DATA.weeks[DATA.weeks.length - 1].monday) select.value = current.week;

  function draw() {
    var grid = document.getElementById('grid');
    var week = +select.value;
    var monday = (DATA.weeks.filter(function (w) { return w.week === week; })[0] || {}).monday;
    var events = DATA.sessions.filter(function (s) { return s.weeks.indexOf(week) >= 0; });
    if (!DATA.weeks.length) { grid.innerHTML = '<p class="tt-empty">Engir tímar birtir.</p>'; return; }
    var days = events.some(function (s) { return s.day > 4; }) ? 7 : 5;
    var end = DAY_END;
    events.forEach(function (s) { end = Math.max(end, minutes(s.end)); });
    var height = (end - DAY_START) * PX_PER_MIN;
    var h = '<div class="tt-grid" style="--days:' + days + '"><div class="tt-head"></div>';
    for (var d = 0; d < days; d++) {
      h += '<div class="tt-head">' + DAY_NAMES[d] + (monday ? ' ' + shortDate(monday, d) : '') + '</div>';
    }
    h += '<div class="tt-times" style="height:' + height + 'px">';
    for (var t = DAY_START; t < end; t += 50) {
      h += '<div class="tt-time" style="top:' + ((t - DAY_START) * PX_PER_MIN) + 'px">' +
        String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0') + '</div>';
    }
    h += '</div>';
    for (d = 0; d < days; d++) {
      h += '<div class="tt-day" style="height:' + height + 'px">';
      for (t = DAY_START; t < end; t += 50) {
        h += '<div class="tt-line" style="top:' + ((t - DAY_START) * PX_PER_MIN) + 'px"></div>';
      }
      // Side-by-side lanes for sessions that overlap (electives, groups).
      var dayEvents = events.filter(function (s) { return s.day === d; })
        .sort(function (a, b) { return minutes(a.start) - minutes(b.start); });
      var clusters = [], cluster = null, clusterEnd = -1;
      dayEvents.forEach(function (s) {
        if (!cluster || minutes(s.start) >= clusterEnd) { cluster = []; clusters.push(cluster); clusterEnd = -1; }
        cluster.push(s); clusterEnd = Math.max(clusterEnd, minutes(s.end));
      });
      clusters.forEach(function (group) {
        var laneEnds = [];
        group.forEach(function (s) {
          var lane = 0;
          while (laneEnds[lane] !== undefined && laneEnds[lane] > minutes(s.start)) lane++;
          laneEnds[lane] = minutes(s.end); s._lane = lane;
        });
        var lanes = laneEnds.length;
        group.forEach(function (s) {
          var top = (minutes(s.start) - DAY_START) * PX_PER_MIN;
          var hgt = (minutes(s.end) - minutes(s.start)) * PX_PER_MIN;
          h += '<div class="tt-ev" style="top:' + top + 'px;height:' + hgt + 'px;left:calc(' +
            (100 * s._lane / lanes) + '% + 1px);width:calc(' + (100 / lanes) + '% - 2px);background:' +
            colors[s.course] + '" title="' + esc(s.course + ' ' + (names[s.course] || '') + '\n' +
            s.kind + ' ' + s.start + '-' + s.end + '\n' + s.room) + '"><b>' + esc(s.course) + '</b>' +
            esc([s.kind, s.room].filter(Boolean).join(' · ')) + '</div>';
        });
      });
      h += '</div>';
    }
    h += '</div>';
    if (!events.length) h += '<p class="tt-empty">Engir tímar þessa viku.</p>';
    grid.innerHTML = h;
  }

  function step(delta) {
    var i = select.selectedIndex + delta;
    if (i >= 0 && i < select.options.length) { select.selectedIndex = i; draw(); }
  }
  select.addEventListener('change', draw);
  document.getElementById('prev').addEventListener('click', function () { step(-1); });
  document.getElementById('next').addEventListener('click', function () { step(1); });
  draw();

  var rows = '<tr><th>Námskeið</th><th>Tegund</th><th>Tími</th><th>Stofa</th><th>Vikur</th></tr>';
  DATA.sessions.forEach(function (s) {
    rows += '<tr><td><span class="tt-swatch" style="background:' + colors[s.course] + '"></span>' +
      esc(s.course) + (names[s.course] ? ' ' + esc(names[s.course]) : '') + '</td><td>' +
      esc(s.kind) + '</td><td>' + DAY_NAMES[s.day] + ' ' + s.start + '-' + s.end + '</td><td>' +
      esc(s.room) + '</td><td>' + ranges(s.weeks) + '</td></tr>';
  });
  document.getElementById('list').innerHTML = rows;
})();
</script>
</body>
</html>
